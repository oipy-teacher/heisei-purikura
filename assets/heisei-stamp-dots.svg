<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- 平成 落書きスタンプ「水玉（ドット）」（柄本 手描き・2026-08-17）
       出典/確度: プリ帳の頻出モチーフに「ドット模様、ボーダー、塗りつぶしなどスタンダードな模様」
       （ROOMIE 2019／二次・確度中）。
       ねらい: これ1個を「なぞる（コロコロ）」と、写真のふちに水玉の帯ができる。
       当時の「余白を柄で埋める」落書きを、いまある仕組み（コロコロ）だけで再現するための駒。
       大中小3粒。等間隔・同色にしない（そろえると印刷物になってしまう）。 -->
  <!-- 大（左上・濃ピンク） -->
  <circle cx="33" cy="34" r="21" fill="#ffffff"/>
  <circle cx="33" cy="34" r="17" fill="#ff2fa0"/>
  <!-- 中（右下・黄） -->
  <circle cx="69" cy="62" r="16" fill="#ffffff"/>
  <circle cx="69" cy="62" r="12" fill="#ffef5c"/>
  <!-- 小（左下・水色。少しだけ大玉に食い込ませる） -->
  <circle cx="26" cy="72" r="11" fill="#ffffff"/>
  <circle cx="26" cy="72" r="7.5" fill="#5cc8ff"/>
</svg>
