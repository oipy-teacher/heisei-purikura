<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- 平成 落書きスタンプ「ボーダー（斜めしま）」（柄本 手描き・2026-08-17）
       出典/確度: プリ帳の頻出モチーフ「ドット模様、ボーダー、塗りつぶし」（ROOMIE 2019／二次・確度中）。
       ねらい: 水玉と同じく、なぞる（コロコロ）と斜めしまの帯になる駒。
       2本の太さをそろえない・端をまっすぐ切らない（定規で引いた線に見せない）。 -->
  <g transform="rotate(-22 48 48)">
    <!-- 太いほう（濃ピンク・白フチ） -->
    <path d="M14 26 L82 22 L82 44 L14 47 Z" fill="#ffffff"/>
    <path d="M17 29 L79 25.5 L79 41 L17 44 Z" fill="#ff2fa0"/>
    <!-- 細いほう（黒紫。少し下がって、右端が短い） -->
    <path d="M14 58 L74 55 L74 70 L14 73 Z" fill="#ffffff"/>
    <path d="M17 61 L71 58.5 L71 67 L17 70 Z" fill="#3a1030"/>
  </g>
</svg>
