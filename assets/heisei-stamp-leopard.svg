<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- 平成 落書きスタンプ「ヒョウ柄」（柄本 手描き・2026-08-28）
       出典/確度:
         ① ヒョウ柄は平成ギャル文化の柱（このオフィスでは 2026-08-12 に
            assets/heisei-leopard-tile.svg として既に意匠を確定済み。今回はその斑の描き方を
            そのまま1駒に落としたもの＝新しい絵柄を持ち込んでいない）／確度=中
         ② 「がらペン（ふち付きがら・透明がら・影付きがら）」がメイクソフトウェア
            パールフラッシュ（2002年11月20日）の当時の商品ページに実在（原文・確度=強）。
            当時の実機に「柄で描く道具」があったこと自体は裏が取れている。
            ただし **その柄がヒョウ柄だったという記述は無い**（要検証）。
       ねらい: 水玉(dots)・ボーダー(stripe)と同じ「なぞる＝コロコロ」でヒョウ柄の帯になる駒。
       規律: グラデ禁止・ハードエッジのみ。斑は3つとも形が違う（回転コピペで量産しない）。
             写真の上でも輪郭が飛ばないよう、斑にも鉤にも白フチを回す。 -->

