<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- 平成ゼブラ柄タイル（柄本 手描き・2026-08-17）
       出典/確度: ヒョウ柄・ゼブラ柄は平成に流行った柄で、近年のプリ機の背景にも復活している
       （BTJ TREND LAB 2025「平成プリクラの歴史と伝説機種復活店舗まとめ」／二次・確度中）。
       ヒョウ柄タイル（heisei-leopard-tile.svg）の相方。使い方も同じ:
       background: url(assets/heisei-tile-zebra.svg) 0 0 / 240px 240px repeat;
       縦の継ぎ目が出ないよう、各バンドは y=0 と y=240 で同じ x に戻している。
       横の継ぎ目用に、左端(x=0)と右端(x=240)へ同じ幅の半バンドを置いた。
       バンドは1本ずつ形が違う（反転コピーで量産していない）。グラデ禁止・2色だけ。 -->
  <rect width="240" height="240" fill="#ffffff"/>

  <!-- 左端の半バンド（右端の半バンドと合わせて1本になる） -->
  <path d="M0 0 L14 0 C9 60 17 120 11 180 C8 205 12 222 14 240 L0 240 Z" fill="#3a1030"/>

  <!-- バンド1（細め・上で右に流れて下で戻る） -->
  <path d="M44 0 C52 40 38 70 47 104 C56 138 40 170 46 205 C49 222 45 232 44 240
           L60 240 C62 228 66 214 62 196 C56 168 72 140 63 106 C55 74 70 42 60 0 Z" fill="#3a1030"/>

  <!-- バンド2（太め・途中でくびれる＝手で描いたゼブラの特徴） -->
  <path d="M96 0 C104 34 88 62 99 96 C110 130 92 160 100 196 C104 214 99 228 96 240
           L126 240 C130 226 136 210 130 190 C120 158 138 128 126 96 C114 64 130 34 120 0 Z" fill="#3a1030"/>

  <!-- バンド3（下で途切れる線。ゼブラには必ず途中で終わる線が混じる。先を細らせている） -->
  <path d="M152 26 C162 56 146 84 156 114 C163 136 156 152 152 164
           L172 168 C180 150 190 128 180 102 C170 76 184 52 174 26 Z" fill="#3a1030"/>

  <!-- バンド4（右寄り・上で太く下で細る1本。左端の半バンドとの間を白く空ける） -->
  <path d="M180 0 C188 36 174 66 184 100 C194 134 178 166 186 202 C190 220 185 232 183 240
           L196 240 C198 226 202 212 197 194 C189 164 203 134 194 100 C185 66 198 36 191 0 Z" fill="#3a1030"/>

  <!-- 右端の半バンド（左端と対になる） -->
  <path d="M226 0 L240 0 L240 240 L226 240 C228 222 232 205 229 180 C223 120 231 60 226 0 Z" fill="#3a1030"/>
</svg>
